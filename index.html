<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conveyor & Lift Physics Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #0f172a; 
            color: white; 
            margin: 0; 
            min-height: 100vh; 
            overflow-y: auto; 
        }
        
        .grid-layout { 
            display: grid; 
            grid-template-columns: 280px 1fr; 
            gap: 20px; 
            min-height: 100vh; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        
        .side-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            position: sticky; 
            top: 20px; 
            height: calc(100vh - 40px); 
            overflow-y: auto; 
            padding-right: 5px; 
        }

        .main-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            min-width: 0; 
        }

        .canvas-container { 
            width: 100%; 
            height: 100%; 
            background: #0b1121; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        canvas { width: 100%; height: auto; object-fit: contain; }
        
        input[type=range] { width: 100%; accent-color: #3b82f6; }
        .btn { background: #3b82f6; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; border: none; color: white;}
        .btn:hover { background: #2563eb; }
        .stat-box { background: #334155; padding: 15px; border-radius: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center;}
        
        .log-box { 
            background: #0f172a; 
            border: 1px solid #334155; 
            padding: 10px; 
            font-family: monospace; 
            font-size: 12px; 
            height: 300px; 
            overflow-y: auto; 
            color: #94a3b8; 
        }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .log-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>

    <div class="grid-layout">
        <div class="side-panel">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-xl">
                <h3 class="text-lg font-bold mb-3 text-blue-400">⚙️ Control Panel</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-semibold flex items-center gap-2">👨‍🔧 Worker (Bags/Min)</label>
                        <div class="mt-2 text-xs text-slate-400 space-y-2">
                            <div class="flex items-center"><span class="w-20 text-yellow-400">Infeed:</span> <input type="range" id="infeedRate" min="2" max="20" value="6" oninput="document.getElementById('infeedRateVal').innerText=this.value"><span class="w-8 text-right font-bold" id="infeedRateVal">6</span></div>
                            <div class="flex items-center"><span class="w-20 text-blue-400">Out PM1:</span> <input type="range" id="outPM1Rate" min="2" max="20" value="6" oninput="document.getElementById('outPM1RateVal').innerText=this.value"><span class="w-8 text-right font-bold" id="outPM1RateVal">6</span></div>
                            <div class="flex items-center"><span class="w-20 text-orange-400">Out PM5:</span> <input type="range" id="outPM5Rate" min="2" max="20" value="6" oninput="document.getElementById('outPM5RateVal').innerText=this.value"><span class="w-8 text-right font-bold" id="outPM5RateVal">6</span></div>
                        </div>
                    </div>

                    <hr class="border-slate-600">
                    
                    <div>
                        <label class="text-sm font-semibold flex items-center gap-2">🚀 ความเร็วระบบ (m/min)</label>
                        <div class="mt-2 text-xs text-slate-400 space-y-2">
                            <div class="flex items-center"><span class="w-20 text-emerald-400">CV Speed:</span> <input type="range" id="cvSpeed" min="10" max="60" value="20" oninput="document.getElementById('cvSpeedVal').innerText=this.value; updateSpeeds();"><span class="w-8 text-right font-bold" id="cvSpeedVal">20</span></div>
                            <div class="flex items-center"><span class="w-20 text-sky-400">Lift Speed:</span> <input type="range" id="liftSpeed" min="10" max="40" value="15" oninput="document.getElementById('liftSpeedVal').innerText=this.value; updateSpeeds();"><span class="w-8 text-right font-bold" id="liftSpeedVal">15</span></div>
                        </div>
                    </div>

                    <hr class="border-slate-600">

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-semibold flex items-center gap-2">📦 Batch Queue</label>
                            <button class="text-xs bg-red-900/50 text-red-400 px-2 py-1 rounded hover:bg-red-800 transition" onclick="clearQueue()">ล้างคิว</button>
                        </div>
                        <div class="flex gap-2 mb-2">
                            <div class="w-1/2">
                                <label class="text-[10px] text-blue-400">PM1 (ถุง)</label>
                                <input type="number" id="qPM1" value="65" class="w-full bg-slate-700 text-white p-1 rounded text-sm text-center border border-slate-600">
                            </div>
                            <div class="w-1/2">
                                <label class="text-[10px] text-orange-400">PM5 (ถุง)</label>
                                <input type="number" id="qPM5" value="65" class="w-full bg-slate-700 text-white p-1 rounded text-sm text-center border border-slate-600">
                            </div>
                            <button onclick="addBatch()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 rounded text-sm mt-4 transition">+</button>
                        </div>
                        <div id="queueList" class="bg-slate-900 p-2 rounded text-xs h-32 overflow-y-auto space-y-1 text-slate-400 border border-slate-700 flex flex-col justify-center items-center">
                            ไม่มีคิวผลิต
                        </div>
                    </div>

                    <hr class="border-slate-600">

                    <div>
                        <label class="text-sm font-semibold flex items-center gap-2 mb-2">⏱️ ตั้งค่าเวลาเครื่อง Mix/Pack (นาที)</label>
                        <div class="flex gap-2">
                            <div class="text-xs text-blue-400 flex items-center gap-1 bg-slate-900 p-1 rounded border border-slate-700 w-1/2 justify-center">
                                PM1: <input type="number" id="pm1MixT" value="6" class="w-8 bg-slate-700 text-white p-1 rounded text-center border border-slate-600 outline-none"> / <input type="number" id="pm1PackT" value="20" class="w-10 bg-slate-700 text-white p-1 rounded text-center border border-slate-600 outline-none">
                            </div>
                            <div class="text-xs text-orange-400 flex items-center gap-1 bg-slate-900 p-1 rounded border border-slate-700 w-1/2 justify-center">
                                PM5: <input type="number" id="pm5MixT" value="8" class="w-8 bg-slate-700 text-white p-1 rounded text-center border border-slate-600 outline-none"> / <input type="number" id="pm5PackT" value="20" class="w-10 bg-slate-700 text-white p-1 rounded text-center border border-slate-600 outline-none">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-semibold">⚡ Run Mode</label>
                        <select id="runMode" class="w-full mt-1 bg-slate-700 text-white text-xs p-2 rounded border border-slate-600 focus:outline-none">
                            <option value="continuous">ต่อเนื่อง (ไม่ต้องรอเครื่องแพ็ค)</option>
                            <option value="wait">ทีละ Batch (รอเคลียร์สายพาน)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-sm font-semibold">⏩ Simulator Speed</label>
                        <select id="simSpeedMode" class="w-full mt-1 bg-slate-700 text-white text-xs p-2 rounded border border-slate-600 focus:outline-none" onchange="timeMultiplier = parseInt(this.value)">
                            <option value="1">1x (เวลาจริง)</option>
                            <option value="5">5x (เร็ว)</option>
                            <option value="20" selected>20x (เร็วมาก)</option>
                            <option value="60">60x (Hyper)</option>
                        </select>
                    </div>
                </div>

                <button id="mainBtn" class="btn bg-emerald-600 hover:bg-emerald-500 w-full mt-6 py-3 text-lg shadow-lg shadow-emerald-900/50 uppercase tracking-wider" onclick="toggleSim()">▶ Start Simulation</button>
            </div>
        </div>

        <div class="main-panel">
            <div class="stats-grid">
                <div class="stat-box border-b-4 border-blue-500 shadow-md">
                    <p class="text-xs text-slate-400 uppercase tracking-widest">Infeed PM1</p>
                    <p id="statIn1" class="text-3xl font-bold text-blue-400">0</p>
                </div>
                <div class="stat-box border-b-4 border-blue-500 shadow-md">
                    <p class="text-xs text-slate-400 uppercase tracking-widest">Outfeed PM1</p>
                    <p id="statOut1" class="text-3xl font-bold text-blue-400">0</p>
                </div>
                <div class="stat-box border-b-4 border-orange-500 shadow-md">
                    <p class="text-xs text-slate-400 uppercase tracking-widest">Infeed PM5</p>
                    <p id="statIn5" class="text-3xl font-bold text-orange-400">0</p>
                </div>
                <div class="stat-box border-b-4 border-orange-500 shadow-md">
                    <p class="text-xs text-slate-400 uppercase tracking-widest">Outfeed PM5</p>
                    <p id="statOut5" class="text-3xl font-bold text-orange-400">0</p>
                </div>
            </div>

            <div class="canvas-container shadow-inner">
                <canvas id="simCanvas" width="1200" height="800"></canvas>
            </div>

            <div class="log-grid">
                <div class="bg-slate-800 rounded-lg border border-slate-700 p-3 shadow-md">
                    <h4 class="text-sm font-bold text-slate-300 mb-2 flex items-center gap-2">📄 Event Logs</h4>
                    <div id="eventLog" class="log-box rounded bg-slate-900"></div>
                </div>
                <div class="bg-slate-800 rounded-lg border border-slate-700 p-3 shadow-md">
                    <h4 class="text-sm font-bold text-slate-300 mb-2 flex items-center gap-2">📊 Batch Summary Report</h4>
                    <div id="reportBox" class="log-box rounded bg-slate-900 p-2 flex flex-col items-center text-center">
                        รอถาดำเนินการ Batch แรก...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCALE = 65; 
        let timeMultiplier = 20;
        let isRunning = false;
        let lastTime = 0;
        let simTimeElapsed = 0; 
        
        let SPEED_CV = 20; 
        let SPEED_LIFT = 15; 

        const BAG_LENGTH = 0.95; 
        const TRAY_SPACING = 2.0; 
        
        const PATH = {
            InfeedEnd: 4.4,   
            LiftLen: 6.0,      
            A3End: 2.3,
            PM1End: 2.3 + 4.2, 
            A4End: 2.3,      
            PM5End: 2.3 + 3.19 + 1.25 + 3.7 
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const logBox = document.getElementById('eventLog');
        const reportBox = document.getElementById('reportBox');
        
        let queues = { 'PM1': [], 'PM5': [] };
        let activeInfeed = { 'PM1': null, 'PM5': null };
        let lastFedType = 'PM5'; 
        let batchCounters = { 'PM1': 1, 'PM5': 1 };
        
        let bags = [];
        let liftCycle = 0;
        let infeedTimer = 0;

        let stats = { in1: 0, out1: 0, in5: 0, out5: 0 };

        let machines = {
            'PM1': { state: 'IDLE', timer: 0, ulTimer: 0, q: 0, currentBatchId: null, currentBatchTotal: 0, timings: {} },
            'PM5': { state: 'IDLE', timer: 0, ulTimer: 0, q: 0, currentBatchId: null, currentBatchTotal: 0, timings: {} }
        };

        function updateSpeeds() {
            SPEED_CV = parseFloat(document.getElementById('cvSpeed').value);
            SPEED_LIFT = parseFloat(document.getElementById('liftSpeed').value);
        }

        function addBatch() {
            let p1 = parseInt(document.getElementById('qPM1').value);
            let p2 = parseInt(document.getElementById('qPM5').value);
            if(p1 > 0) queues['PM1'].push({ id: batchCounters['PM1']++, type: 'PM1', total: p1, left: p1 });
            if(p2 > 0) queues['PM5'].push({ id: batchCounters['PM5']++, type: 'PM5', total: p2, left: p2 });
            updateQueueUI();
        }

        function clearQueue() {
            queues = { 'PM1': [], 'PM5': [] };
            activeInfeed = { 'PM1': null, 'PM5': null };
            batchCounters = { 'PM1': 1, 'PM5': 1 };
            updateQueueUI();
        }

        function updateQueueUI() {
            const q = document.getElementById('queueList');
            let hasActive = activeInfeed['PM1'] || activeInfeed['PM5'];
            let hasQueue = queues['PM1'].length > 0 || queues['PM5'].length > 0;

            if(!hasActive && !hasQueue) {
                q.innerHTML = 'ไม่มีคิวผลิต';
                q.classList.add('justify-center', 'items-center');
                return;
            }
            q.classList.remove('justify-center', 'items-center');
            let html = '';

            ['PM1', 'PM5'].forEach(type => {
                if(activeInfeed[type]) {
                    let b = activeInfeed[type];
                    let color = type === 'PM1' ? 'text-blue-400' : 'text-orange-400';
                    html += `<div class="p-1.5 border border-emerald-500/50 bg-emerald-900/20 rounded mb-1 shadow-sm">
                        <span class="text-emerald-400 text-[10px] animate-pulse">▶ กำลังป้อน:</span> 
                        <span class="${color} font-bold">B${b.id} (${b.type})</span> 
                        <span class="text-slate-300 ml-1">- เหลือ ${b.left}/${b.total} ถุง</span>
                    </div>`;
                }
            });

            let maxLen = Math.max(queues['PM1'].length, queues['PM5'].length);
            for(let i=0; i<maxLen; i++) {
                if(queues['PM1'][i]) {
                    let b = queues['PM1'][i];
                    html += `<div class="p-1 border border-slate-700 bg-slate-800 rounded mb-1 text-slate-300">รอคิว: <span class="text-blue-400 font-bold">B${b.id} (PM1)</span> - ${b.total} ถุง</div>`;
                }
                if(queues['PM5'][i]) {
                    let b = queues['PM5'][i];
                    html += `<div class="p-1 border border-slate-700 bg-slate-800 rounded mb-1 text-slate-300">รอคิว: <span class="text-orange-400 font-bold">B${b.id} (PM5)</span> - ${b.total} ถุง</div>`;
                }
            }
            q.innerHTML = html;
        }

        function addLog(msg, type='normal') {
            const d = new Date(simTimeElapsed * 60000);
            const timeStr = d.toISOString().substr(14, 5);
            let color = '#94a3b8';
            if(type==='info') color = '#60a5fa';
            if(type==='success') color = '#34d399';
            if(type==='warn') color = '#fbbf24';
            if(type==='error') color = '#ef4444';
            
            const m = `<div style="color:${color}" class="mb-1 border-b border-slate-800/50 pb-1">[${timeStr}] ${msg}</div>`;
            logBox.innerHTML += m;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function addReport(machine, batchId, timeMins, isFirst) {
            if(reportBox.innerText.includes('รอถาดำเนินการ')) {
                reportBox.innerHTML = '';
                reportBox.classList.remove('justify-center', 'items-center', 'text-center');
                reportBox.classList.add('items-stretch', 'text-left');
            }
            
            let remark = isFirst ? 
                "(คำนวณตั้งแต่ถุงแรกเข้าจุด Infeed)" : 
                "(คำนวณตั้งแต่เริ่มเทถุงแรกที่ Outfeed)";
            
            let borderColor = machine === 'PM1' ? 'border-blue-500' : 'border-orange-500';
            let icon = machine === 'PM1' ? '🔵' : '🟠';
            
            let html = `
            <div class="bg-slate-800/80 p-2.5 rounded mb-2 border-l-4 ${borderColor} shadow-sm w-full flex flex-col sm:flex-row sm:justify-between sm:items-center">
                <div>
                    <div class="font-bold text-white text-sm">${icon} [${machine}] Batch #${batchId} แพ็คเสร็จสมบูรณ์</div>
                    <div class="text-[10px] text-slate-500 mt-1 italic">${remark}</div>
                </div>
                <div class="mt-2 sm:mt-0 flex items-center gap-2">
                    <span class="text-xs text-slate-300">⏱️ Process Time:</span>
                    <span class="text-emerald-400 font-bold bg-emerald-900/30 px-2 py-0.5 rounded border border-emerald-800">${timeMins.toFixed(1)} นาที</span>
                </div>
            </div>`;
            
            reportBox.innerHTML += html; 
            reportBox.scrollTop = reportBox.scrollHeight; 
        }

        function toggleSim() {
            isRunning = !isRunning;
            const btn = document.getElementById('mainBtn');
            if(isRunning) {
                btn.innerHTML = '⏸ <span class="tracking-widest">Pause Simulation</span>';
                btn.classList.replace('bg-emerald-600', 'bg-amber-600');
                btn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-500');
                btn.classList.replace('shadow-emerald-900/50', 'shadow-amber-900/50');
                lastTime = performance.now();
                requestAnimationFrame(simLoop);
                addLog('▶️ System Started', 'success');
            } else {
                btn.innerHTML = '▶ <span class="tracking-widest">Start Simulation</span>';
                btn.classList.replace('bg-amber-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-amber-500', 'hover:bg-emerald-500');
                btn.classList.replace('shadow-amber-900/50', 'shadow-emerald-900/50');
                addLog('⏸ System Paused', 'error');
            }
        }

        function simLoop(timestamp) {
            if(!isRunning) return;
            const dtSec = ((timestamp - lastTime) / 1000) * timeMultiplier;
            const dtMin = dtSec / 60;
            lastTime = timestamp;
            simTimeElapsed += dtMin;

            // 1. Infeed Logic
            ['PM1', 'PM5'].forEach(type => {
                if (!activeInfeed[type] && queues[type].length > 0) {
                    const runMode = document.getElementById('runMode').value;
                    let canStart = true;
                    if (runMode === 'wait') {
                        if (machines[type].state !== 'IDLE' || bags.some(b => b.type === type)) {
                            canStart = false;
                        }
                    }
                    if (canStart) {
                        activeInfeed[type] = queues[type].shift();
                        if(!machines[type].timings[activeInfeed[type].id]) {
                            machines[type].timings[activeInfeed[type].id] = { infeedStart: simTimeElapsed };
                        }
                        
                        addLog(`👨‍🔧 Infeed เริ่มเท ${type} Batch #${activeInfeed[type].id}`);
                        updateQueueUI();
                    }
                }
            });

            let typeToFeed = null;
            if (activeInfeed['PM1'] && activeInfeed['PM5']) {
                typeToFeed = lastFedType === 'PM1' ? 'PM5' : 'PM1';
            } else if (activeInfeed['PM1']) {
                typeToFeed = 'PM1';
            } else if (activeInfeed['PM5']) {
                typeToFeed = 'PM5';
            }

            if (typeToFeed) {
                infeedTimer -= dtMin;
                if(infeedTimer <= 0) {
                    let maxPos = PATH.InfeedEnd;
                    for (let other of bags) {
                        if (other.stage === 'infeed' || other.stage === 'wait_lift') {
                            maxPos = Math.min(maxPos, other.pos - BAG_LENGTH);
                        }
                    }
                    let isSpaceFree = (maxPos >= 0);

                    if (isSpaceFree) {
                        const rate = parseFloat(document.getElementById('infeedRate').value);
                        infeedTimer = 1 / rate;
                        let batch = activeInfeed[typeToFeed];
                        
                        bags.push({
                            id: Math.random(),
                            type: batch.type,
                            batchId: batch.id,
                            batchTotal: batch.total, 
                            stage: 'infeed', 
                            pos: 0
                        });
                        batch.left--;
                        lastFedType = typeToFeed; 

                        if(batch.type === 'PM1') stats.in1++; else stats.in5++;
                        updateQueueUI();

                        if(batch.left <= 0) {
                            addLog(`✅ Infeed ป้อน ${batch.type} Batch #${batch.id} ครบแล้ว`);
                            activeInfeed[typeToFeed] = null;
                            updateQueueUI();
                        }
                    } else {
                        infeedTimer = 0; 
                    }
                }
            } else {
                infeedTimer = 0;
            }

            ['PM1', 'PM5'].forEach(mKey => {
                let m = machines[mKey];
                
                if(m.state === 'UNLOADING') {
                    m.ulTimer -= dtMin;
                    if(m.ulTimer <= 0) {
                        m.ulTimer = 0; 
                    }
                }

                if(m.state === 'MIXING' || m.state === 'PACKING') {
                    m.timer -= dtMin;
                    if(m.timer <= 0) {
                        if(m.state === 'MIXING') {
                            m.state = 'PACKING';
                            m.timer = parseFloat(document.getElementById(mKey.toLowerCase()+'PackT').value);
                            addLog(`⚙️ ${mKey} started PACKING`, 'info');
                        } else {
                            m.state = 'IDLE';
                            addLog(`📦 ${mKey} PACKED Batch #${m.currentBatchId}`, 'success');
                            
                            let t = m.timings[m.currentBatchId];
                            let totalProcessTime;
                            let isFirst = false;
                            
                            if (m.currentBatchId === 1 || !t.outfeedStart) {
                                totalProcessTime = simTimeElapsed - t.infeedStart;
                                isFirst = true;
                            } else {
                                totalProcessTime = simTimeElapsed - t.outfeedStart;
                            }
                                
                            addReport(mKey, m.currentBatchId, totalProcessTime, isFirst);
                            m.currentBatchId = null;
                        }
                    }
                }
            });

            let isLiftExitBlocked = bags.some(b => 
                (b.stage === 'convey' || b.stage === 'wait_unload') && 
                (b.pos < BAG_LENGTH)
            );
            let isLiftMoving = !isLiftExitBlocked; 

            if (isLiftMoving) {
                liftCycle = (liftCycle + (SPEED_LIFT * dtMin)) % TRAY_SPACING;
            }
            const isTrayAligned = (liftCycle < 0.2 || liftCycle > 1.8);

            const outRate1 = parseFloat(document.getElementById('outPM1Rate').value);
            const outRate5 = parseFloat(document.getElementById('outPM5Rate').value);

            for(let i=0; i<bags.length; i++) {
                let b = bags[i];
                let m = machines[b.type];
                
                if(b.stage === 'infeed') {
                    let maxPos = PATH.InfeedEnd;
                    for (let other of bags) {
                        if (other !== b && (other.stage === 'infeed' || other.stage === 'wait_lift') && other.pos > b.pos) {
                            maxPos = Math.min(maxPos, other.pos - BAG_LENGTH);
                        }
                    }
                    b.pos += SPEED_CV * dtMin;
                    if(b.pos >= maxPos) b.pos = maxPos;
                    if(b.pos >= PATH.InfeedEnd) {
                        b.pos = PATH.InfeedEnd;
                        b.stage = 'wait_lift';
                    }
                }
                else if (b.stage === 'wait_lift') {
                    let isFront = !bags.some(other => other.stage === 'lifting' && other.pos < 1.0);
                    if(isFront && isTrayAligned && isLiftMoving) {
                        b.stage = 'lifting';
                        b.pos = 0;
                    }
                }
                else if (b.stage === 'lifting') {
                    if (isLiftMoving) {
                        b.pos += SPEED_LIFT * dtMin;
                    }
                    if(b.pos >= PATH.LiftLen) {
                        if (!isLiftExitBlocked) {
                            b.pos = 0;
                            b.stage = 'convey';
                        } else {
                            b.pos = PATH.LiftLen; 
                        }
                    }
                }
                else if (b.stage === 'convey') {
                    let totalLen = b.type === 'PM1' ? PATH.PM1End : PATH.PM5End;
                    let maxPos = totalLen;
                    
                    for(let other of bags) {
                        if(other !== b && (other.stage === 'convey' || other.stage === 'wait_unload')) {
                            if (b.type === other.type) {
                                if (other.pos > b.pos) maxPos = Math.min(maxPos, other.pos - BAG_LENGTH);
                            } else {
                                if (other.pos > b.pos && (other.pos - BAG_LENGTH) < PATH.A4End) {
                                    maxPos = Math.min(maxPos, other.pos - BAG_LENGTH);
                                }
                            }
                        }
                    }

                    b.pos += SPEED_CV * dtMin;
                    if(b.pos >= maxPos) b.pos = maxPos;
                    
                    if(b.pos >= totalLen) {
                        b.pos = totalLen;
                        b.stage = 'wait_unload';
                    }
                }
                else if (b.stage === 'wait_unload') {
                    if(m.state === 'IDLE' || m.state === 'UNLOADING') {
                        if(m.state === 'IDLE' && m.currentBatchId === null) {
                            m.state = 'UNLOADING';
                            m.currentBatchId = b.batchId;
                            m.currentBatchTotal = b.batchTotal; 
                            m.q = 0;
                            m.ulTimer = 1 / (b.type === 'PM1' ? outRate1 : outRate5); 
                        }
                        
                        if(m.currentBatchId === b.batchId && m.state === 'UNLOADING' && m.ulTimer <= 0) {
                            
                            // 🛑 OEE Time Fix: บันทึกเฉพาะตอนกรีดถุงใบแรกของ Batch เท่านั้น
                            if (!m.timings[b.batchId]) m.timings[b.batchId] = {};
                            if (m.q === 0 && !m.timings[b.batchId].outfeedStart) {
                                m.timings[b.batchId].outfeedStart = simTimeElapsed;
                            }

                            b.stage = 'done';
                            m.q++;
                            if(b.type === 'PM1') stats.out1++; else stats.out5++;
                            
                            if(m.q >= m.currentBatchTotal) {
                                m.state = 'MIXING';
                                m.timer = parseFloat(document.getElementById(mKey.toLowerCase()+'MixT').value);
                                addLog(`🚚 ${mKey} Unloaded Batch #${m.currentBatchId}`, 'info');
                                addLog(`🔄 ${mKey} started MIXING`, 'warn');
                            } else {
                                m.ulTimer = 1 / (b.type === 'PM1' ? outRate1 : outRate5);
                            }
                        }
                    }
                }
            }

            bags = bags.filter(b => b.stage !== 'done');

            document.getElementById('statIn1').innerText = stats.in1;
            document.getElementById('statOut1').innerText = stats.out1;
            document.getElementById('statIn5').innerText = stats.in5;
            document.getElementById('statOut5').innerText = stats.out5;

            draw();
            requestAnimationFrame(simLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const Y_LOWER = 700; 
            const Y_UPPER = 430; 
            
            const xA1 = 80;
            const xB1 = xA1 + (PATH.InfeedEnd * SCALE);
            
            const xA3 = xB1 + 60; 
            const xA4 = xA3 + (PATH.A3End * SCALE);
            
            ctx.strokeStyle = '#1e293b'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, Y_LOWER+20); ctx.lineTo(canvas.width, Y_LOWER+20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, Y_UPPER+20); ctx.lineTo(canvas.width, Y_UPPER+20); ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#64748b'; ctx.font = '14px Sarabun';
            ctx.fillText('📍 ชั้นล่าง (Lower Level)', xA1 + 50, Y_LOWER - 30);
            ctx.fillText('📍 ชั้นบน (Upper Level)', xA3 + 50, Y_UPPER - 30);

            ctx.lineWidth = 14; ctx.strokeStyle = '#475569'; ctx.lineCap = 'butt';
            ctx.setLineDash([15, 10]);
            
            ctx.beginPath(); ctx.moveTo(xA1, Y_LOWER); ctx.lineTo(xB1, Y_LOWER); ctx.stroke();
            
            let pm1EndX = xA3 + (PATH.PM1End * SCALE);
            ctx.beginPath(); ctx.moveTo(xA3, Y_UPPER); ctx.lineTo(pm1EndX, Y_UPPER); ctx.stroke();
            
            let pathA6Len = 3.19 * SCALE;
            let R = 0.8 * SCALE; 
            let cx = xA4 + R; 
            let cy = Y_UPPER - pathA6Len;

            ctx.beginPath(); 
            ctx.moveTo(xA4, Y_UPPER); 
            ctx.lineTo(xA4, cy); 
            ctx.arc(cx, cy, R, Math.PI, 1.5 * Math.PI); 
            let a8EndX = cx + (3.7 * SCALE);
            ctx.lineTo(a8EndX, cy - R); 
            ctx.stroke();
            
            ctx.setLineDash([]); 
            
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
            ctx.fillText(`S1 (In)`, xA1 + 10, Y_LOWER - 25);
            ctx.fillText(`A1+A2 (Infeed 4.4m)`, xA1 + 20, Y_LOWER - 15);
            ctx.fillText(`S2 (Wait)`, xB1 - 40, Y_LOWER - 25);
            
            ctx.fillText(`S3 (Clear)`, xA3 + 10, Y_UPPER - 25);
            ctx.fillText(`A3 (2.3m)`, xA3 + 10, Y_UPPER - 15);
            ctx.fillText(`S4 (Sort)`, xA4 - 30, Y_UPPER - 25);
            
            ctx.fillText(`A5 (PM1 4.2m)`, xA4 + 30, Y_UPPER - 15);
            ctx.fillText(`S5 (PM1)`, pm1EndX - 30, Y_UPPER - 25);
            
            ctx.fillText(`A6 (3.19m)`, xA4 + 15, Y_UPPER - pathA6Len/2);
            ctx.fillText(`A7 (R800)`, cx - R + 15, cy - R + 20);
            ctx.fillText(`A8 (PM5 3.7m)`, cx + 50, cy - R - 15);
            ctx.fillText(`S6 (PM5)`, a8EndX - 30, cy - R - 25);
            
            const drawSensor = (x, y, isActive) => {
                ctx.fillStyle = isActive ? '#ef4444' : '#10b981'; 
                ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();
            };
            const isBagAt = (posLimit, stage) => bags.some(b => b.stage === stage && b.pos >= posLimit - 0.5);

            drawSensor(xA1 + 20, Y_LOWER - 15, isBagAt(0, 'infeed'));
            drawSensor(xB1 - 20, Y_LOWER - 15, isBagAt(PATH.InfeedEnd, 'wait_lift'));
            drawSensor(xA3 + 20, Y_UPPER - 15, isBagAt(0, 'convey'));
            drawSensor(xA4 - 20, Y_UPPER - 15, isBagAt(PATH.A4End, 'convey'));
            drawSensor(pm1EndX - 20, Y_UPPER - 15, bags.some(b => b.type==='PM1' && b.stage === 'wait_unload'));
            drawSensor(a8EndX - 20, cy - R - 15, bags.some(b => b.type==='PM5' && b.stage === 'wait_unload'));

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(xA4-10, Y_UPPER + 10, 20, 10);
            ctx.fillRect(xA4-5, Y_UPPER + 20, 10, 15);
            ctx.fillText('A4 Pusher', xA4 - 20, Y_UPPER + 45);

            let liftWidth = 60;
            let liftTopY = Y_UPPER - 80;
            let liftBotY = Y_LOWER + 50;
            ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2;
            ctx.strokeRect(xB1, liftTopY, liftWidth, liftBotY - liftTopY);
            ctx.fillStyle = '#0ea5e9'; ctx.fillText(`B1 (Lift 6m)`, xB1, liftBotY + 15);
            
            ctx.strokeStyle = '#334155'; ctx.setLineDash([3,3]);
            ctx.beginPath(); ctx.moveTo(xB1+30, liftTopY); ctx.lineTo(xB1+30, liftBotY); ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#38bdf8'; 
            for(let i=0; i<=PATH.LiftLen; i+=TRAY_SPACING) {
                let yPos = i - liftCycle;
                if(yPos < 0) yPos += 12;
                if(yPos <= PATH.LiftLen) {
                    let drawY = Y_LOWER - (yPos / PATH.LiftLen) * (Y_LOWER - Y_UPPER);
                    ctx.fillRect(xB1 + 5, drawY - 3, 20, 6);
                }
            }
            ctx.fillStyle = '#475569'; 
            for(let i=0; i<=PATH.LiftLen; i+=TRAY_SPACING) {
                let yPos = i - liftCycle;
                if(yPos < 0) yPos += 12;
                if(yPos > PATH.LiftLen && yPos <= 12) {
                    let downPos = 12 - yPos; 
                    let drawY = Y_LOWER - (downPos / PATH.LiftLen) * (Y_LOWER - Y_UPPER);
                    ctx.fillRect(xB1 + 35, drawY - 3, 20, 6);
                }
            }

            const drawMachine = (name, x, y, color) => {
                let m = machines[name];
                ctx.fillStyle = color;
                ctx.fillRect(x, y - 40, 120, 80);
                ctx.fillStyle = 'white'; ctx.font = 'bold 24px sans-serif';
                ctx.fillText(name, x + 30, y + 10);
                
                ctx.fillStyle = m.state === 'IDLE' ? '#64748b' : 
                               m.state === 'UNLOADING' ? '#10b981' : '#eab308';
                ctx.fillRect(x, y + 40, 120, 30);
                ctx.fillStyle = 'white'; ctx.font = 'bold 14px sans-serif';
                
                let text = m.state;
                if(m.state === 'UNLOADING') {
                    text += ` ${m.q}/${m.currentBatchTotal}`;
                } else if(m.state !== 'IDLE') {
                    let min = Math.floor(m.timer);
                    let sec = Math.floor((m.timer - min)*60);
                    text += ` ${min}:${sec.toString().padStart(2,'0')}`;
                }
                ctx.fillText(text, x + 10, y + 60);
            };

            drawMachine('PM1', pm1EndX, Y_UPPER, '#2563eb');
            drawMachine('PM5', a8EndX, cy - R, '#ea580c');

            bags.forEach(b => {
                ctx.fillStyle = b.type === 'PM1' ? '#60a5fa' : '#fb923c';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                
                let drawW = BAG_LENGTH * SCALE; 
                let drawH = 22; 
                let xCenter, yCenter, rotation = 0;
                let isLifting = false;

                if (b.stage === 'infeed' || b.stage === 'wait_lift') {
                    xCenter = xA1 + (b.pos * SCALE);
                    yCenter = Y_LOWER;
                } 
                else if (b.stage === 'lifting') {
                    xCenter = xB1 + 15;
                    yCenter = Y_LOWER - (b.pos / PATH.LiftLen) * (Y_LOWER - Y_UPPER);
                    isLifting = true;
                } 
                else if (b.stage === 'convey' || b.stage === 'wait_unload') {
                    if (b.pos <= PATH.A4End) { 
                        xCenter = xA3 + (b.pos * SCALE);
                        yCenter = Y_UPPER;
                    } else {
                        if (b.type === 'PM1') { 
                            let dist = b.pos - PATH.A4End;
                            xCenter = xA4 + (dist * SCALE);
                            yCenter = Y_UPPER;
                        } else { 
                            let dist = b.pos - PATH.A4End;
                            if (dist <= 3.19) { 
                                xCenter = xA4;
                                yCenter = Y_UPPER - (dist * SCALE);
                                rotation = -Math.PI / 2;
                            } else if (dist <= 3.19 + 1.25) { 
                                let arcDist = dist - 3.19;
                                let arcRatio = arcDist / 1.25;
                                let angle = Math.PI + (arcRatio * Math.PI / 2); 
                                xCenter = cx + R * Math.cos(angle);
                                yCenter = cy + R * Math.sin(angle);
                                rotation = angle + (Math.PI / 2);
                            } else { 
                                let dist8 = dist - (3.19 + 1.25);
                                xCenter = cx + (dist8 * SCALE);
                                yCenter = cy - R;
                                rotation = 0;
                            }
                        }
                    }
                }
                
                if (xCenter !== undefined && yCenter !== undefined) {
                    ctx.save();
                    ctx.translate(xCenter, yCenter);
                    ctx.rotate(rotation);

                    if (isLifting) {
                        drawW = 24; drawH = 16; 
                        ctx.fillRect(-drawW/2, -drawH/2, drawW, drawH);
                        ctx.strokeRect(-drawW/2, -drawH/2, drawW, drawH);
                        ctx.fillStyle = 'white'; ctx.font='10px sans-serif';
                        ctx.fillText(`⬆ ${b.pos.toFixed(1)}m`, drawW, 4);
                    } else {
                        ctx.fillRect(-drawW/2, -drawH/2, drawW, drawH);
                        ctx.strokeRect(-drawW/2, -drawH/2, drawW, drawH);
                        ctx.fillStyle = 'black'; ctx.font = '12px bold sans-serif';
                        ctx.fillText(`B${b.batchId}`, -10, 4);
                    }
                    
                    ctx.restore();
                }
            });
        }

        draw();
        updateQueueUI();
    </script>
</body>
